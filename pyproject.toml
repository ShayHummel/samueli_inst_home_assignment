[project]
name = "samueli-nlp-assignment"
version = "0.1.0"
description = "Samueli Institute home assignment - NLP Research Scientist (clinical text & LLMs)"
readme = "README.md"
requires-python = ">=3.11"

# Everything needed to run the code and the test suite. Deliberately not split
# into per-part extras: a reviewer should get a working environment from a bare
# `uv sync` without having to know which extra maps to which question.
dependencies = [
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "numpy>=2.4.6",
]

[project.scripts]
# Stable commands that work from any directory and sidestep the
# "python src/foo.py" relative-import trap entirely.
samueli-evaluate = "src.evaluate:main"
samueli-pipeline = "src.demo:demo"
# Assembles the PDF deliverable from results/*.md plus the live prompt modules.
samueli-pdf = "src.build_pdf:main"

[dependency-groups]
# Installed by `uv sync` by default, so the IDE's interpreter can see them.
#   psycopg      - the Task 3.1 SQL tests talk to a real PostgreSQL cluster
#   pandas-stubs - type information for pandas, for editor code insight
#   ruff         - lint; keeps unused imports and undeclared packages out
dev = [
    "pandas-stubs>=3.0.5.260730",
    "psycopg[binary]>=3.2",
    "pytest>=8.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# F catches the class of problem that prompted this config: unused imports and
# undefined names. I enforces a deterministic import order so a diff never churns
# on it. The rest are cheap correctness rules with no style opinions.
select = ["E", "F", "I", "UP", "B", "SIM", "ISC"]
ignore = [
    "E501",    # line length is handled by the formatter, not the linter
    "SIM108",  # ternary-vs-if is a readability call, not a rule
]

[tool.ruff.lint.per-file-ignores]
# Test doubles legitimately shadow names and assert on private detail.
"tests/*" = ["B011"]
