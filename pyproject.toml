[project]
name = "samueli-nlp-assignment"
version = "0.1.0"
description = "Samueli Institute home assignment - NLP Research Scientist (clinical text & LLMs)"
readme = "README.md"
requires-python = ">=3.11"

# Everything needed to run the code and the test suite. Deliberately not split
# into per-part extras: a reviewer should get a working environment from a bare
# `uv sync` without having to know which extra maps to which question.
dependencies = [
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Only genuinely optional extras live here: these are needed to run the Part 3.1
# SQL against a live PostgreSQL instance, which the rest of the project does not
# require.
postgres = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
# Installed by `uv sync` by default, so the IDE's interpreter can see pytest.
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
