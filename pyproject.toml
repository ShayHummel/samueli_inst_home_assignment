[project]
name = "samueli-nlp-assignment"
version = "0.1.0"
description = "Samueli Institute home assignment - NLP Research Scientist (clinical text & LLMs)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Populated per-part as we implement. Kept explicit so reviewers see what each
# part actually needs rather than one undifferentiated blob.
part2 = [
    "langchain-core>=0.3",
    "pydantic>=2.7",
]
part3 = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
